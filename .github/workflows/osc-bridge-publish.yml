name: OSC Bridge — Build & Publish

# Standalone OSC bridge image publisher (F10.2.1).
#
# - On push to main that touches the standalone or the shared YAML mappings:
#   builds multi-platform (amd64 + arm64 for Raspberry Pi 4/5) and pushes
#   to ghcr.io/<owner>/<repo>/osc-bridge with `latest` + sha tags.
# - On PRs that touch the same paths: builds amd64 only as a sanity check
#   (no push to keep GHCR clean of PR cruft).
#
# Image: ghcr.io/felippepestana/aiox-squads-felippepestana/osc-bridge
#   Tags: latest, sha-<branch>-<sha>, semver if a tag is pushed.

on:
  push:
    branches: [main, master]
    paths:
      - "squads/transmissao-multicam/osc-bridge-standalone/**"
      - "squads/transmissao-multicam/data/osc-mapping.yaml"
      - "squads/transmissao-multicam/data/mic-mapping.yaml"
      - ".github/workflows/osc-bridge-publish.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "squads/transmissao-multicam/osc-bridge-standalone/**"
      - "squads/transmissao-multicam/data/osc-mapping.yaml"
      - "squads/transmissao-multicam/data/mic-mapping.yaml"
      - ".github/workflows/osc-bridge-publish.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/osc-bridge

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        # Needed for cross-arch builds (arm64 from an amd64 runner).
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=${{ github.ref_name }}-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push OSC bridge image
        uses: docker/build-push-action@v5
        with:
          # Build context = squad dir; Dockerfile lives inside the standalone
          # but it needs ../data/*.yaml so the context goes one level up.
          context: ./squads/transmissao-multicam
          file: ./squads/transmissao-multicam/osc-bridge-standalone/Dockerfile
          # PRs: build only, don't push. main: push.
          push: ${{ github.event_name != 'pull_request' }}
          # arm64 covers Raspberry Pi 4/5 (the documented target hardware).
          # amd64 covers x86 servers and dev laptops.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=osc-bridge
          cache-to: type=gha,scope=osc-bridge,mode=max
