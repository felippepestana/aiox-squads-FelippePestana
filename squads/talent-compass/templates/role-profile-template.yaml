# role-profile-template — output of define-role (role-architect)
# Role-agnostic: derive everything from performance objectives, not a fixed template.
role_profile:
  role_title: "{e.g., Customer Success Manager}"
  team: "{team / area}"
  reason_open: "{why this role exists now}"
  seniority: "{junior | mid | senior | lead}"

  # 4-6 measurable outcomes for the first 6-12 months. Outcomes, not tasks.
  performance_objectives:
    - id: PO1
      outcome: "{measurable outcome, e.g., own renewals for ~40 accounts at >=92% gross retention}"
      metric: "{how success is measured}"
    - id: PO2
      outcome: "{...}"
      metric: "{...}"
    # ... up to PO6

  # Only competencies that predict the objectives above.
  competencies:
    technical:
      - name: "{e.g., renewals & commercial process}"
        predicts: ["PO1"]
        bars:
          "1": "{weak demonstration}"
          "3": "{solid demonstration}"
          "5": "{strong demonstration}"
    behavioral:
      - name: "{e.g., ownership under pressure}"
        predicts: ["PO1", "PO5"]
        bars:
          "1": "{...}"
          "3": "{...}"
          "5": "{...}"
    motivation:
      - signal: "{intrinsic motivation aligned to the work, e.g., energized by long-term customer outcomes}"
        predicts: ["PO1", "PO2"]

  # Evidence decides. Personality is context with weight 0.
  scorecard_weights:
    technical_competencies: 40
    behavioral_competencies: 35
    motivation_fit: 25
    behavioral_style_context: 0   # MUST stay 0 — context only

  notes: "{constraints, must-haves vs. nice-to-haves, market context}"
