name: apex-talent
display_name: "Apex-Talent — Plataforma de Gestão de Pessoas AI-Native"
version: "1.0.0"
domain: human-resources
entry_agent: apex-talent-chief
description: "Plataforma guarda-chuva de RH/People AI-native. Orquestra módulos especializados (R&S, comportamental, desempenho, clima, DP/folha, ponto, onboarding, treinamento, people analytics, cargos & salários, benefícios), cada um como um squad AIOX. Roteia o usuário ao módulo certo e consolida visões cross-módulo."

keywords:
  - human resources
  - people management
  - recrutamento e seleção
  - gestão de desempenho
  - clima organizacional
  - departamento pessoal
  - people analytics
  - hris
  - gestão de talentos
  - rh ai-native

metadata:
  type: platform
  status: ACTIVE
  modules:
    - { squad: "talent-compass", area: "Recrutamento & Seleção + Entrevistas", status: ACTIVE }
    - { squad: "profiler-dna", area: "Inteligência Comportamental", status: ACTIVE }
    - { squad: "performa", area: "Gestão de Desempenho", status: ACTIVE }
    - { squad: "pulse", area: "Clima & Engajamento", status: ACTIVE }
    - { squad: "peopleops", area: "Departamento Pessoal & Folha", status: ACTIVE }
    - { squad: "chronos", area: "Controle de Ponto", status: ACTIVE }
    - { squad: "onboard", area: "Onboarding & Integração", status: ACTIVE }
    - { squad: "academy", area: "Treinamento & Desenvolvimento", status: ACTIVE }
    - { squad: "insights", area: "People Analytics", status: ACTIVE }
    - { squad: "org-architect", area: "Cargos, Salários & Org Design", status: ACTIVE }
    - { squad: "benefits-hub", area: "Benefícios", status: ACTIVE }

tier_structure:
  tier_0:
    role: "Platform Orchestration"
    agents: ["apex-talent-chief"]

workflow:
  primary: "wf-employee-lifecycle"
  cross_module:
    - "wf-employee-lifecycle — mapa de orquestração (7 etapas → módulos + handoffs)"
    - "wf-hire-to-onboard — contratar → integrar → desenvolver"
    - "wf-retention-loop — operar → analisar → desenvolver (RH preditivo)"
  phases:
    - "Phase 1: INTAKE - Entender a necessidade de RH do usuário"
    - "Phase 2: ROUTE - Encaminhar ao módulo (squad) responsável (route-need)"
    - "Phase 3: CHAIN - Encadear módulos em pedidos multi-etapa (map-lifecycle)"
    - "Phase 4: SYNTHESIZE - Consolidar visões cross-módulo (consolidate-cross-module)"

entry_points:
  catalog: "*catalog"
  route: "*route"
  roadmap: "*roadmap"
  lifecycle: "*lifecycle"

workspace_integration:
  level: read_write
  produces:
    - "workspace/apex-talent/cross-module-report.md"
  consumes:
    - "outputs dos módulos (performa, pulse, chronos, insights, academy, ...) para consolidação cross-módulo"
  rationale: >-
    O apex-talent orquestra a plataforma: roteia necessidades (route-need), encadeia
    módulos em pedidos multi-etapa (map-lifecycle) e consolida visões cross-módulo
    (consolidate-cross-module) gravando um relatório em workspace/. Respeita os quality
    gates dos módulos-fonte na consolidação; não decide pelos módulos.
