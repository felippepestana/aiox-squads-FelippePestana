# Base normativa de referência para o squad prefeitura-digital.
# Citações simplificadas; sempre confirmar o texto vigente no Planalto/órgão competente.

constituicao:
  - dispositivo: "CF/1988 art. 37"
    tema: "Princípios da administração (publicidade, legalidade, impessoalidade, moralidade, eficiência)"
