# Estrutura organizacional — Prefeitura de Porto Velho/RO
# Base: Lei Complementar nº 1.000/2025 e Decreto nº 21.133/2025 (reforma administrativa, vigência jul/2025).
# IMPORTANTE: estrutura sujeita a alterações; confirmar a norma vigente para outros municípios ou exercícios.

municipio:
  nome: "Porto Velho"
  uf: "RO"
  codigo_ibge: "1100205"
  populacao_estimada: "~517.000 (2025/2026)"
  site_oficial: "https://www.portovelho.ro.gov.br/"
  sei: "https://sei.portovelho.ro.gov.br/"
  transparencia: "https://transparencia.portovelho.ro.gov.br/"
  norma_estrutura: "LC nº 1.000/2025; Decreto nº 21.133/2025"

secretarias:
  - sigla: "Semtran"
    nome: "Secretaria Municipal de Segurança, Trânsito e Mobilidade"
    competencias: "Guarda Municipal, defesa civil, trânsito, transportes e segurança pública"
  - sigla: "Semdec"
    nome: "Secretaria Municipal de Desenvolvimento da Cidade"
    competencias: "Planos diretores, habitação, urbanização, regularização fundiária"
  - sigla: "Semtel"
    nome: "Secretaria Municipal de Turismo, Esporte e Lazer"
    competencias: "Promoção turística, esportes e programas de lazer"
  - sigla: "Semad"
    nome: "Secretaria Municipal de Administração"
    competencias: "Gestão de pessoas (RH), serviços gerais e funcionamento da Administração"
  - sigla: "Semias"
    nome: "Secretaria Municipal de Inclusão e Assistência Social"
    competencias: "Assistência social, políticas inclusivas e educação especial"
  - sigla: "Semagric"
    nome: "Secretaria Municipal de Agricultura, Pecuária e Abastecimento"
    competencias: "Política agrícola e defesa agropecuária"
  - sigla: "Semusa"
    nome: "Secretaria Municipal de Saúde"
    competencias: "Atenção à saúde, atenção básica e vigilância sanitária"
    vinculacao: "Mínimo de 15% (LC 141/2012) — SIOPS"
  - sigla: "Semed"
    nome: "Secretaria Municipal de Educação"
    competencias: "Educação infantil e ensino fundamental, currículo e políticas educacionais"
    vinculacao: "Mínimo de 25% + FUNDEB (art. 212 CF) — SIOPE"
  - sigla: "Seinfra"
    nome: "Secretaria Municipal de Infraestrutura"
    competencias: "Obras públicas, saneamento e limpeza urbana"
  - sigla: "Semec"
    nome: "Secretaria Municipal de Economia"
    competencias: "Orçamento, tributação e planejamento financeiro (fazenda)"
  - sigla: "Secom"
    nome: "Secretaria Municipal de Comunicação"
    competencias: "Comunicação social e divulgação governamental"
  - sigla: "SMCL"
    nome: "Secretaria Municipal de Contratos, Convênios e Licitações"
    competencias: "Condução de licitações, compras e gestão de contratos"

orgaos_complementares:
  - sigla: "PGM"
    nome: "Procuradoria Geral do Município"
    competencias: "Representação judicial e consultoria jurídica"
  - sigla: "CGM"
    nome: "Controladoria Geral do Município"
    competencias: "Controle interno, auditoria e responsabilização administrativa"
  - sigla: "IPAM"
    nome: "Instituto de Previdência e Assistência dos Servidores"
    competencias: "Regime Próprio de Previdência (RPPS) — ~27 mil segurados; criado pela LC 001/1990"

interacoes_tipicas:
  contratacao: "Secretaria demandante define a necessidade → SMCL conduz a licitação → Semec/orçamento → PGM (parecer) → publicação no DOM/PNCP"
  pessoal: "Semad instrui atos de pessoal → controle de limite (LRF) → IPAM (aposentadoria/RPPS) → publicação no DOM"
  orcamento: "Semec coordena PPA/LDO/LOA e a execução orçamentária de todas as secretarias"
