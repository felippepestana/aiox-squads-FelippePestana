# Guardrails per agent, mirrored from the Notion database
# "Agentes IA - Papéis, Prompts e Guardrails".
# Every agent requires human validation for sensitive legal acts.

global_rules:
  - "Todo agente tem escopo delimitado e produz saída estruturada."
  - "Toda recomendação jurídica sensível exige revisão humana."
  - "Todo documento faltante gera pendência objetiva para o setor responsável."
  - "Toda decisão automatizada possui justificativa, fonte e nível de confiança."
  - "Toda classificação é rastreável ao documento analisado."
  - "Judicialização, corte, negativação e defesa nunca são automáticas."

agents:
  juris-orchestrator:
    risk_level: "Crítico"
    human_validation: true
    can_automate:
      - "Triagem, classificação, roteamento, criação de pendências e consolidação de recomendações."
    cannot_automate:
      - "Ajuizamento, protocolo de defesa, autorização de corte, negativação ou decisão jurídica final."

  datajud-intelligence-analyst:
    risk_level: "Alto"
    human_validation: true
    can_automate:
      - "Classificação, deduplicação preliminar, agrupamento e geração de indicadores."
    cannot_automate:
      - "Atribuir resultado processual sem movimento/decisão suficiente."
      - "Validar mérito sem inteiro teor."

  document-intake-validator:
    risk_level: "Alto"
    human_validation: true
    can_automate:
      - "Checklist, extração OCR, identificação de pendências e devolução setorial."
    cannot_automate:
      - "Aprovar judicialização sem revisão jurídica quando houver risco alto ou crítico."

  recovery-score-analyst:
    risk_level: "Alto"
    human_validation: true
    can_automate:
      - "Cálculo de score, priorização de carteira e recomendação de rota."
    cannot_automate:
      - "Protocolar ação, assinar peça, assumir risco jurídico sem advogado."

  passive-defense-strategist:
    risk_level: "Crítico"
    human_validation: true
    can_automate:
      - "Leitura, extração, resumo, checklist e minuta assistida."
    cannot_automate:
      - "Protocolar contestação ou reconhecer falha sem advogado responsável."

  toi-legal-builder:
    risk_level: "Crítico"
    human_validation: true
    can_automate:
      - "Checklist técnico-jurídico, extração de dados e identificação de falhas."
    cannot_automate:
      - "Declarar fraude conclusivamente sem validação técnica e jurídica humana."

  cortesafe-validator:
    risk_level: "Crítico"
    human_validation: true
    can_automate:
      - "Checagem de calendário, pagamento, notificação, SLA e risco preliminar."
    cannot_automate:
      - "Autorizar corte efetivo sem regra operacional validada e supervisão humana."

  negativesafe-validator:
    risk_level: "Crítico"
    human_validation: true
    can_automate:
      - "Validação preliminar e bloqueio por inconsistência documental."
    cannot_automate:
      - "Efetivar negativação sem política interna, base legal e revisão quando houver risco."

  legal-thesis-curator:
    risk_level: "Alto"
    human_validation: true
    can_automate:
      - "Levantamento de precedentes com fonte, consolidação de teses e alertas de mudança de entendimento."
    cannot_automate:
      - "Definir tese oficial do escritório sem validação do advogado responsável."

  lgpd-compliance-auditor:
    risk_level: "Crítico"
    human_validation: true
    can_automate:
      - "Alertas, classificação de sensibilidade e checklist de conformidade."
    cannot_automate:
      - "Liberar uso de dados sensíveis sem política e validação jurídica/compliance."

  humanized-communication-writer:
    risk_level: "Médio"
    human_validation: true
    can_automate:
      - "Rascunhos, solicitações internas, lembretes e comunicações de baixa criticidade."
    cannot_automate:
      - "Enviar comunicação externa sensível sem aprovação em casos de alto risco."

  kpi-board-reporter:
    risk_level: "Alto"
    human_validation: true
    can_automate:
      - "Relatórios, gráficos, consolidação e narrativa preliminar."
    cannot_automate:
      - "Apresentar estimativas como dados confirmados ou omitir limitações metodológicas."
