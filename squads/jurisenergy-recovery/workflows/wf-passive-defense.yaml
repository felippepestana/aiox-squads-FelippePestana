id: wf-passive-defense
name: Passive Defense Pipeline
trigger: "Ação movida contra a Energisa (consumerista, dano moral, corte, negativação)"
steps:
  - id: triage
    agent: juris-recovery-chief
    task: route-and-triage-case
    gate: QG-JR-001
  - id: intake
    agent: document-intake-analyst
    task: validate-document-checklist
    gate: QG-JR-002
  - id: act-reconstruction
    parallel: true
    optional: true
    agents: [cortesafe-analyst, negativesafe-analyst, toi-legal-builder]
    tasks: [validate-disconnection-safety, validate-negativation-safety, validate-toi-robustness]
    description: "Reconstruir a regularidade do ato questionado (corte, negativação ou TOI) quando for o objeto da ação."
  - id: defense-strategy
    agent: passive-defense-strategist
    task: build-passive-defense-strategy
    gate: QG-JR-003
  - id: quality-review
    agent: jurisprudence-quality-reviewer
    task: review-legal-quality
  - id: human-validation
    type: human_gate
    gate: QG-JR-004
    description: "Advogado responsável valida tese, minuta e recomendação de acordo ou contestação."
outputs:
  - passive-defense-strategy.md
  - assisted-draft.md
  - audit-trail.md
