id: wf-toi-safe-collections
name: TOI and Safe Collections Pipeline
trigger: "TOI, recuperação de consumo, corte, religação ou negativação a executar com segurança"
steps:
  - id: triage
    agent: juris-recovery-chief
    task: route-and-triage-case
    gate: QG-JR-001
  - id: intake
    agent: document-intake-analyst
    task: validate-document-checklist
    gate: QG-JR-002
  - id: toi-robustness
    agent: toi-legal-builder
    task: validate-toi-robustness
    optional: true
    gate: QG-JR-003
  - id: execution-safety
    parallel: true
    agents: [cortesafe-analyst, negativesafe-analyst]
    tasks: [validate-disconnection-safety, validate-negativation-safety]
    gate: QG-JR-005
  - id: communication
    agent: humanized-communication-writer
    task: draft-humanized-communication
    gate: QG-JR-006
  - id: compliance
    agent: lgpd-compliance-auditor
    task: run-lgpd-compliance-audit
    gate: QG-JR-007
  - id: human-validation
    type: human_gate
    gate: QG-JR-004
    description: "Nenhum corte, negativação ou cobrança de TOI é efetivado sem supervisão humana e regra operacional validada."
outputs:
  - toi-robustness-report.md
  - execution-safety-report.md
  - audit-trail.md
