# Squad Creator Pro — metadata-only config
#
# This squad has no executable artifacts in this repo. The agents, tasks,
# and workflows described in README.md live in the proprietary aiox-core
# upgrade pack and are activated by separate installation.
#
# This file exists so:
#   - anatomy linters that walk squads/* find a config and don't fail
#   - catalog tooling can list the Pro pack with the right status
#   - someone reading the squad knows where the implementation lives
#
# Keep this file minimal. Do NOT add agents:, tasks:, or template paths
# that don't exist here — they'd be lies.

metadata:
  version: "1.0"
  squad: "squad-creator-pro"
  schema: "metadata-only"

squad:
  name: "squad-creator-pro"
  display_name: "Squad Creator Pro"
  domain: "Meta — Upgrade pack for the Squad Creator base"
  description: |
    Upgrade pack que estende o Squad Creator base com 3 agentes especialistas,
    34 tasks exclusivas, 18 workflows, mind cloning (Voice DNA + Thinking DNA),
    model routing com economia de tokens, 17 test cases e golden baselines.

    Implementação vive no aiox-core (repo privado de upgrade), não neste repo.
  status: "PRODUCT_SPEC"  # not DEVELOPING; not ACTIVE — see README.md banner
  implementation_repo: "https://github.com/SynkraAI/aiox-core"

  base_squad: "squad-creator"   # this Pro pack extends the base squad
