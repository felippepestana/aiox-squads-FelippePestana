openapi: 3.1.0
info:
  title: APEX Plataforma de Cursos Livres - API (draft v0.1)
  version: 0.1.0
  summary: Reference contract for the public/BFF API of the APEX platform.
  description: |
    Draft contract used to align web, mobile, partners and automation. It covers the
    Phase 1-2 surface (identity, catalog, checkout, learning, certificates, live events,
    tutor AI, leads, approvals) plus the outbound webhook envelope.

    Conventions
    * JSON over HTTPS, UTF-8. Money is an integer in cents plus an ISO 4217 currency.
    * Errors follow RFC 9457 (`application/problem+json`).
    * Unsafe operations that create money movements accept an `Idempotency-Key` header.
    * Pagination is cursor based (`limit`, `cursor`).
    * Every request is scoped to a tenant (resolved from the host or the API key).
  license:
    name: Proprietary - internal draft
    identifier: LicenseRef-APEX-Internal
servers:
  - url: https://api.apex.invalid/v1
    description: Placeholder host (replace when the domain is defined)
tags:
  - name: Auth
    description: Registration, login and session management.
  - name: Me
    description: The authenticated person - profile, consents and data-subject rights.
  - name: Catalog
    description: Products, offers and public product pages.
  - name: Compliance
    description: Compliance Guardian checks on texts and products.
  - name: Checkout
    description: Checkout sessions, orders, refunds and subscriptions.
  - name: Learning
    description: Enrollments, progress, assessments and certificates.
  - name: Media
    description: Protected playback of lesson media.
  - name: Live
    description: Webinars, workshops and registrations.
  - name: AI
    description: Tutor AI conversations and agent governance.
  - name: Growth
    description: Lead capture and affiliates.
  - name: Admin
    description: Back-office approvals and workflows.
  - name: Webhooks
    description: Inbound provider webhooks and outbound webhook endpoints.
security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      tags: [Auth]
      operationId: registerUser
      summary: Create an account
      description: Creates a user. Terms and privacy consents are mandatory and recorded with proof.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created; a verification e-mail is sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Sign in with e-mail and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session issued (or an MFA challenge is returned).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current session
      responses:
        '204':
          description: Session revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me:
    get:
      tags: [Me]
      operationId: getMe
      summary: Current person
      responses:
        '200':
          description: Profile of the authenticated person.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Me]
      operationId: updateMe
      summary: Update profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeUpdate'
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/consents:
    get:
      tags: [Me]
      operationId: listMyConsents
      summary: Consents granted or revoked by the person
      responses:
        '200':
          description: Consent history.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Consent'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Me]
      operationId: recordConsent
      summary: Grant or revoke a consent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentChange'
      responses:
        '201':
          description: Consent recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/data-requests:
    post:
      tags: [Me]
      operationId: createDataRequest
      summary: Open a data-subject request (LGPD)
      description: Access, correction, anonymization, deletion, portability or consent revocation. The legal deadline is tracked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataRequestCreate'
      responses:
        '202':
          description: Request registered with a due date.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /products:
    get:
      tags: [Catalog]
      operationId: listProducts
      summary: List published products
      security: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/ProductType'
        - name: q
          in: query
          description: Free text search (typo tolerant).
          schema:
            type: string
            maxLength: 120
        - name: category
          in: query
          schema:
            type: string
        - name: level
          in: query
          schema:
            type: string
            enum: [beginner, intermediate, advanced, all]
      responses:
        '200':
          description: Page of products.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags: [Catalog]
      operationId: createProduct
      summary: Create a draft product (instructor or content staff)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
      responses:
        '201':
          description: Draft created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /products/{productId}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      tags: [Catalog]
      operationId: getProduct
      summary: Product page data (id or slug)
      security: []
      responses:
        '200':
          description: Product with active offers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Catalog]
      operationId: updateProduct
      summary: Update a draft or published product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdate'
      responses:
        '200':
          description: Updated product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /products/{productId}/publish:
    post:
      tags: [Catalog]
      operationId: requestProductPublication
      summary: Ask to publish (runs the Compliance Guardian first)
      description: |
        Publication is blocked when the Guardian finds forbidden terms (for example
        "MBA", "pos-graduacao", "reconhecido pelo MEC") or result promises. The response
        explains each finding.
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '202':
          description: Accepted; the product moves to review or is scheduled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Blocked by the Compliance Guardian.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ComplianceProblem'
  /compliance/scan:
    post:
      tags: [Compliance]
      operationId: scanText
      summary: Check a text against the Guardian rules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanRequest'
      responses:
        '200':
          description: Findings (empty when compliant).
          content:
            application/json:
              schema:
                type: object
                required: [findings]
                properties:
                  findings:
                    type: array
                    items:
                      $ref: '#/components/schemas/ComplianceFinding'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /checkout/sessions:
    post:
      tags: [Checkout]
      operationId: createCheckoutSession
      summary: Start a checkout
      description: Prices are always recomputed on the server; the client never sends amounts.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutSessionCreate'
      responses:
        '201':
          description: Session created with the priced summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /checkout/sessions/{sessionId}/orders:
    post:
      tags: [Checkout]
      operationId: placeOrder
      summary: Place the order and create the charge
      description: |
        Records the acceptance of the terms (version, time, IP) and creates the payment at the PSP.
        Pix returns a QR code; card returns the authorization result; boleto returns the slip.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOrderRequest'
      responses:
        '201':
          description: Order created; follow `payment` for the next action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          description: Payment refused.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /orders:
    get:
      tags: [Checkout]
      operationId: listMyOrders
      summary: My orders
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of orders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /orders/{orderId}:
    get:
      tags: [Checkout]
      operationId: getOrder
      summary: Order detail with payment status and fiscal document
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /orders/{orderId}/refund-requests:
    post:
      tags: [Checkout]
      operationId: requestRefund
      summary: Ask for a refund
      description: |
        Inside the 7-day withdrawal period (CDC art. 49) the refund is approved automatically,
        regardless of how much content was consumed. Outside it, the request goes to a person.
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 500
      responses:
        '202':
          description: Refund registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /subscriptions/{subscriptionId}/cancel:
    post:
      tags: [Checkout]
      operationId: cancelSubscription
      summary: Cancel a subscription (self-service, at most two interactions)
      parameters:
        - name: subscriptionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Cancellation scheduled for the end of the paid period.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /me/enrollments:
    get:
      tags: [Learning]
      operationId: listMyEnrollments
      summary: My enrollments with progress
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of enrollments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /enrollments/{enrollmentId}/lessons/{lessonId}/progress:
    put:
      tags: [Learning]
      operationId: saveLessonProgress
      summary: Save playback position / completion
      description: Idempotent upsert; clients may batch and debounce.
      parameters:
        - $ref: '#/components/parameters/EnrollmentId'
        - $ref: '#/components/parameters/LessonId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgressUpdate'
      responses:
        '200':
          description: Stored progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonProgress'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /enrollments/{enrollmentId}/assessments/{assessmentId}/attempts:
    post:
      tags: [Learning]
      operationId: startAttempt
      summary: Start an assessment attempt
      parameters:
        - $ref: '#/components/parameters/EnrollmentId'
        - name: assessmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Attempt created with the questions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attempt'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /me/certificates:
    get:
      tags: [Learning]
      operationId: listMyCertificates
      summary: My certificates
      responses:
        '200':
          description: Certificates issued to the person.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Certificate'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /certificates/verify/{code}:
    get:
      tags: [Learning]
      operationId: verifyCertificate
      summary: Public certificate verification
      description: Returns validity and the minimum data needed to verify authenticity.
      security: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
      responses:
        '200':
          description: Verification result (valid or revoked).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateVerification'
        '404':
          $ref: '#/components/responses/NotFound'
  /lessons/{lessonId}/playback:
    get:
      tags: [Media]
      operationId: getPlaybackToken
      summary: Short-lived signed playback URL
      description: Requires an active entitlement. The URL is bound to the viewer and domain; a dynamic watermark may be applied.
      parameters:
        - $ref: '#/components/parameters/LessonId'
      responses:
        '200':
          description: Signed playback data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playback'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /events:
    get:
      tags: [Live]
      operationId: listEvents
      summary: Upcoming live events
      security: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: kind
          in: query
          schema:
            type: string
            enum: [webinar, workshop, class, mentoring_group, summit]
      responses:
        '200':
          description: Page of events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
        '400':
          $ref: '#/components/responses/BadRequest'
  /events/{eventId}/registrations:
    post:
      tags: [Live]
      operationId: registerForEvent
      summary: Register for a free event or redeem a ticket
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventRegistrationCreate'
      responses:
        '201':
          description: Registered; confirmation and reminders scheduled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventRegistration'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Event is full; the person was put on the waitlist or is already registered.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /ai/tutor/threads:
    post:
      tags: [AI]
      operationId: createTutorThread
      summary: Open a tutor conversation tied to a lesson
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId]
              properties:
                productId:
                  type: string
                  format: uuid
                lessonId:
                  type: string
                  format: uuid
                mode:
                  type: string
                  enum: [socratic, direct, review, quiz, study_plan]
                  default: socratic
      responses:
        '201':
          description: Thread created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TutorThread'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /ai/tutor/threads/{threadId}/messages:
    post:
      tags: [AI]
      operationId: sendTutorMessage
      summary: Ask the tutor (streamed)
      description: |
        Answers are grounded in the content the person is entitled to and carry citations
        (lesson and timestamp). Without evidence the tutor says it did not find the answer
        and offers a human. The response streams as server-sent events.
      parameters:
        - name: threadId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  minLength: 1
                  maxLength: 4000
      responses:
        '200':
          description: Server-sent events with the answer and its citations.
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /ai/messages/{messageId}/feedback:
    post:
      tags: [AI]
      operationId: rateTutorMessage
      summary: Thumbs up/down on an answer
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  type: integer
                  enum: [-1, 1]
                reason:
                  type: string
                  maxLength: 500
      responses:
        '204':
          description: Feedback stored.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/ai/agents/{agentId}/kill-switch:
    put:
      tags: [AI]
      operationId: setAgentKillSwitch
      summary: Turn an agent off (or back on) immediately
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
                reason:
                  type: string
      responses:
        '200':
          description: State applied and audited.
          content:
            application/json:
              schema:
                type: object
                required: [agentId, killSwitch]
                properties:
                  agentId:
                    type: string
                    format: uuid
                  killSwitch:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /leads:
    post:
      tags: [Growth]
      operationId: captureLead
      summary: Capture a lead with consent
      description: Used by landing pages, quizzes and event sign-ups. Marketing consent is explicit and per channel.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadCreate'
      responses:
        '202':
          description: Lead accepted.
          content:
            application/json:
              schema:
                type: object
                required: [contactId]
                properties:
                  contactId:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /affiliates/applications:
    post:
      tags: [Growth]
      operationId: applyAsAffiliate
      summary: Apply to the affiliate program
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [acceptedTermsVersion]
              properties:
                acceptedTermsVersion:
                  type: string
                channelDescription:
                  type: string
                  maxLength: 1000
      responses:
        '202':
          description: Application received; approval is manual at first.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/approvals:
    get:
      tags: [Admin]
      operationId: listApprovals
      summary: Approval inbox (humans in the loop)
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected, expired]
            default: pending
      responses:
        '200':
          description: Page of approvals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/approvals/{approvalId}/decision:
    post:
      tags: [Admin]
      operationId: decideApproval
      summary: Approve or reject
      parameters:
        - name: approvalId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [approve, reject]
                note:
                  type: string
                  maxLength: 1000
      responses:
        '200':
          description: Decision recorded; the pending action proceeds or is canceled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /webhooks/psp/{provider}:
    post:
      tags: [Webhooks]
      operationId: receivePspWebhook
      summary: Inbound payment-provider webhook
      description: |
        Verifies the provider signature, stores the raw payload, answers 2xx quickly and
        processes asynchronously. Duplicates are ignored through the provider reference.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9_-]{2,32}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '202':
          description: Accepted for processing.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /webhook-endpoints:
    get:
      tags: [Webhooks]
      operationId: listWebhookEndpoints
      summary: Outbound webhook endpoints
      responses:
        '200':
          description: Registered endpoints.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookEndpoint'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Webhooks]
      operationId: createWebhookEndpoint
      summary: Register an outbound endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events]
              properties:
                url:
                  type: string
                  format: uri
                  pattern: '^https://'
                events:
                  type: array
                  minItems: 1
                  items:
                    type: string
      responses:
        '201':
          description: Created. The signing secret is returned once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
webhooks:
  domainEvent:
    post:
      tags: [Webhooks]
      operationId: deliverDomainEvent
      summary: Outbound domain event delivery
      description: |
        Sent to registered endpoints with `X-Apex-Signature: t=<unix>,v1=<hmac-sha256 of "t.body">`.
        Delivery is at-least-once with exponential back-off; consumers must deduplicate by `id`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventEnvelope'
      responses:
        '2XX':
          description: Acknowledged.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Session access token issued by /auth/login.
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Server-to-server key with scopes (Phase 3+).
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor returned by the previous page.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client generated unique key; retries with the same key return the original result.
      schema:
        type: string
        minLength: 8
        maxLength: 100
    ProductId:
      name: productId
      in: path
      required: true
      description: Product id (uuid) or slug.
      schema:
        type: string
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EnrollmentId:
      name: enrollmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LessonId:
      name: lessonId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Authenticated but not allowed (role, entitlement or tenant).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: State conflict (duplicate, capacity, invalid transition).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Stable machine-readable error code.
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
    ComplianceProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [findings]
          properties:
            findings:
              type: array
              items:
                $ref: '#/components/schemas/ComplianceFinding'
    ComplianceFinding:
      type: object
      required: [layer, severity, excerpt]
      properties:
        layer:
          type: string
          enum: [L1, L2, L3, L4, L5, L6, L7]
        category:
          type: string
          enum: [regulated_education_equivalence, government_recognition, result_promise, regulated_profession, false_scarcity, personal_data, copyright, other]
        severity:
          type: string
          enum: [block, review, warn]
        excerpt:
          type: string
        suggestion:
          type: string
    ScanRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          maxLength: 20000
        targetType:
          type: string
          enum: [product, landing_page, message, certificate_template]
    Money:
      type: object
      required: [amountCents, currency]
      properties:
        amountCents:
          type: integer
          minimum: 0
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          default: BRL
    RegisterRequest:
      type: object
      required: [email, password, fullName, acceptedTermsVersion, acceptedPrivacyVersion, adultDeclaration]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 10
          maxLength: 128
          writeOnly: true
        fullName:
          type: string
          maxLength: 200
        acceptedTermsVersion:
          type: string
        acceptedPrivacyVersion:
          type: string
        adultDeclaration:
          type: boolean
          description: Declares the person is 18 or older (launch audience). Minors require the guardian flow.
        marketingConsents:
          type: array
          items:
            type: string
            enum: [marketing_email, marketing_whatsapp, marketing_sms]
