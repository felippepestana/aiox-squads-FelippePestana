# Render Blueprint — deploy do Portal Apex-Talent (v1) com URL HTTPS pública.
#
# Como usar (uma vez, ~2 min):
#   1. Abra https://render.com/deploy?repo=https://github.com/felippepestana/aiox-squads-FelippePestana
#      (ou: dashboard.render.com → New + → Blueprint → conecte este repositório)
#   2. O Render lê este arquivo e cria o serviço Docker
#   3. Preencha os secrets pedidos (obrigatório: ANTHROPIC_API_KEY;
#      os SUPABASE_* são opcionais — deixe em branco para pular a persistência)
#   4. Apply/Deploy → a URL real aparece no painel do serviço
#      (ex.: https://aiox-squads-web.onrender.com ou com sufixo se o nome estiver em uso)
#
# Faz build da MESMA imagem validada na CI (web/Dockerfile, contexto = raiz,
# inclui squads/). Health em /api/health.
#
# Porta: o Render injeta a env PORT em runtime e o servidor a lê (bind em
# process.env.PORT) — sobrepõe o ENV PORT=8787 do Dockerfile. Nada a configurar.

services:
  - type: web
    name: aiox-squads-web
    runtime: docker
    repo: https://github.com/felippepestana/aiox-squads-FelippePestana
    branch: main
    dockerfilePath: ./web/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # ── Obrigatória ────────────────────────────────────────────────────────
      - key: ANTHROPIC_API_KEY
        sync: false          # secreto — o painel pede o valor no deploy
      # ── Runtime ────────────────────────────────────────────────────────────
      - key: NODE_ENV
        value: production
      - key: SQUADS_ROOT
        value: /app/squads
      - key: TRUST_PROXY
        value: "1"
      # ── Opcionais: persistência Supabase (cadastro de administrador PF/PJ,
      #    entrevistas do talent-compass). Deixe em branco para pular —
      #    o app degrada com elegância (valida sem gravar). ──────────────────
      - key: SUPABASE_URL
        sync: false          # ex.: https://<ref>.supabase.co (pode deixar vazio)
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false          # secreto, somente servidor (pode deixar vazio)
      # ── Opcional: proteger as rotas /api/* com uma chave de portal.
      #    A UI pede a chave uma vez e guarda em sessionStorage. ──────────────
      # - key: WEB_PORTAL_API_KEY
      #   sync: false
